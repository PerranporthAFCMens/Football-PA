<!doctype html>

<head>

<title>Football PA</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;margin:40px;color:#10202f}a{color:#1687ff}</style>
</head>
<body>
<script>
(function(){
  const path=location.pathname;
  const match=path.match(/^\/perranporth(\/.*)?$/i);
  if(match){
    const rest=match[1]||'/';
    location.replace('/Perranporth'+rest+location.search+location.hash);
    return;
  }
})();
</script>
<h1>Page not found</h1>
<p><a href="/">Return to Football PA</a></p>
</body>
</html>
