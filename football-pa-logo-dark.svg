<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">Football PA logo</title>
  <desc id="desc">A digital football management logo with tablet and phone dashboards, statistics, finance, man of the match ranking and a football.</desc>

  <defs>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06233d"/>
      <stop offset="1" stop-color="#001426"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f27a"/>
      <stop offset="1" stop-color="#00b94f"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e4ee"/>
    </linearGradient>
    <radialGradient id="goldGrad" cx="35%" cy="25%" r="80%">
      <stop offset="0" stop-color="#fff3a7"/>
      <stop offset="0.45" stop-color="#ffd447"/>
      <stop offset="1" stop-color="#f3a400"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#001425" flood-opacity="0.28"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tabletClip">
      <rect x="435" y="155" width="720" height="850" rx="82"/>
    </clipPath>
  </defs>

  <!-- Growth / analytics bars -->
  <g opacity="0.98" filter="url(#softGlow)">
    <rect x="165" y="560" width="72" height="310" rx="18" fill="url(#greenGrad)"/>
    <rect x="260" y="465" width="72" height="405" rx="18" fill="url(#greenGrad)"/>
    <rect x="355" y="355" width="72" height="515" rx="18" fill="url(#greenGrad)"/>
  </g>

  <!-- Tablet -->
  <g filter="url(#shadow)">
    <rect x="390" y="95" width="820" height="980" rx="105" fill="url(#navyGrad)" stroke="#dce9f3" stroke-width="12"/>
    <rect x="435" y="155" width="720" height="850" rx="82" fill="#0a2f50"/>
  </g>

  <g clip-path="url(#tabletClip)">
    <!-- Header -->
    <rect x="470" y="205" width="650" height="88" rx="22" fill="#113d60"/>
    <circle cx="515" cy="249" r="11" fill="#00e86d"/>
    <rect x="545" y="232" width="185" height="16" rx="8" fill="#6d8da7"/>
    <rect x="545" y="258" width="120" height="12" rx="6" fill="#405f78"/>

    <!-- Finance card -->
    <rect x="470" y="330" width="290" height="240" rx="28" fill="#0d3758" stroke="#1c5277" stroke-width="3"/>
    <text x="500" y="382" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#eaf4fb">TEAM FINANCE</text>
    <text x="500" y="445" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#00ed72">£2,450</text>
    <text x="500" y="482" font-family="Inter, Arial, sans-serif" font-size="22" fill="#93adc0">Balance</text>
    <rect x="505" y="517" width="34" height="30" rx="8" fill="#5f7688"/>
    <rect x="552" y="500" width="34" height="47" rx="8" fill="#7890a1"/>
    <rect x="599" y="475" width="34" height="72" rx="8" fill="#a2b5c2"/>
    <rect x="646" y="440" width="34" height="107" rx="8" fill="url(#greenGrad)"/>

    <!-- Stats card -->
    <rect x="790" y="330" width="330" height="240" rx="28" fill="#0d3758" stroke="#1c5277" stroke-width="3"/>
    <text x="820" y="382" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#eaf4fb">MATCH STATS</text>
    <g font-family="Inter, Arial, sans-serif" font-size="25" fill="#dce9f3">
      <text x="820" y="438">Goals</text><text x="1065" y="438" text-anchor="end" font-weight="800" fill="#00ed72">3</text>
      <text x="820" y="480">Assists</text><text x="1065" y="480" text-anchor="end" font-weight="800" fill="#00ed72">2</text>
      <text x="820" y="522">Shots</text><text x="1065" y="522" text-anchor="end" font-weight="800" fill="#00ed72">11</text>
    </g>

    <!-- Player performance card -->
    <rect x="470" y="610" width="650" height="320" rx="30" fill="#0d3758" stroke="#1c5277" stroke-width="3"/>
    <text x="505" y="666" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#eaf4fb">PLAYER PERFORMANCE</text>
    <g stroke="#2f668b" stroke-width="3">
      <line x1="520" y1="870" x2="1068" y2="870"/>
      <line x1="520" y1="812" x2="1068" y2="812"/>
      <line x1="520" y1="754" x2="1068" y2="754"/>
    </g>
    <polyline points="540,835 650,795 760,815 870,730 980,755 1060,690"
      fill="none" stroke="#00ed72" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#00ed72">
      <circle cx="540" cy="835" r="10"/><circle cx="650" cy="795" r="10"/><circle cx="760" cy="815" r="10"/>
      <circle cx="870" cy="730" r="10"/><circle cx="980" cy="755" r="10"/><circle cx="1060" cy="690" r="10"/>
    </g>
  </g>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="970" y="410" width="405" height="680" rx="80" fill="url(#navyGrad)" stroke="#dce9f3" stroke-width="10"/>
    <rect x="1004" y="462" width="337" height="576" rx="46" fill="#082d4b"/>
    <rect x="1096" y="432" width="152" height="18" rx="9" fill="#274a66"/>
  </g>

  <!-- Star -->
  <path d="M1172 520 L1194 565 L1244 572 L1208 607 L1217 657 L1172 633 L1127 657 L1136 607 L1100 572 L1150 565 Z"
        fill="url(#goldGrad)" stroke="#ffe47b" stroke-width="4"/>

  <text x="1172" y="715" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="39" font-weight="900" fill="#ffffff">
    MAN OF THE
  </text>
  <text x="1172" y="760" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="39" font-weight="900" fill="#ffffff">
    MATCH
  </text>

  <!-- MOTM ranking -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="1040" y="805" width="265" height="70" rx="18" fill="#0d3f5b"/>
    <text x="1067" y="850" font-size="27" font-weight="800" fill="#00ed72">1</text>
    <rect x="1110" y="829" width="125" height="22" rx="11" fill="url(#greenGrad)"/>
    <text x="1275" y="851" font-size="24" text-anchor="end" fill="#ffffff">24</text>

    <rect x="1040" y="892" width="265" height="70" rx="18" fill="#0d3f5b"/>
    <text x="1067" y="937" font-size="27" font-weight="800" fill="#a9bfce">2</text>
    <rect x="1110" y="916" width="88" height="22" rx="11" fill="#89a2b4"/>
    <text x="1275" y="938" font-size="24" text-anchor="end" fill="#ffffff">18</text>

    <rect x="1040" y="979" width="265" height="70" rx="18" fill="#0d3f5b"/>
    <text x="1067" y="1024" font-size="27" font-weight="800" fill="#a9bfce">3</text>
    <rect x="1110" y="1003" width="58" height="22" rx="11" fill="#667f92"/>
    <text x="1275" y="1025" font-size="24" text-anchor="end" fill="#ffffff">12</text>
  </g>

  <!-- Football -->
  <g filter="url(#shadow)">
    <circle cx="495" cy="865" r="228" fill="url(#silverGrad)" stroke="#06233d" stroke-width="18"/>
    <polygon points="495,730 565,781 540,865 450,865 425,781" fill="#06233d"/>
    <polygon points="361,816 421,781 445,865 393,918 330,885" fill="#06233d"/>
    <polygon points="629,816 569,781 545,865 597,918 660,885" fill="#06233d"/>
    <polygon points="408,1010 445,923 540,923 582,1008 495,1060" fill="#06233d"/>
    <polyline points="425,781 361,816 325,755" fill="none" stroke="#06233d" stroke-width="12"/>
    <polyline points="565,781 629,816 665,755" fill="none" stroke="#06233d" stroke-width="12"/>
    <polyline points="393,918 408,1010 350,1060" fill="none" stroke="#06233d" stroke-width="12"/>
    <polyline points="597,918 582,1008 642,1060" fill="none" stroke="#06233d" stroke-width="12"/>
  </g>

  <!-- Sweep / digital motion line -->
  <path d="M130 930 C300 1180 760 1215 1215 1035"
        fill="none" stroke="#0a2d49" stroke-width="46" stroke-linecap="round"/>
  <path d="M130 910 C325 1110 770 1165 1280 970"
        fill="none" stroke="url(#greenGrad)" stroke-width="34" stroke-linecap="round"/>

  <!-- Main wordmark -->
  <g filter="url(#shadow)">
    <rect x="90" y="1160" width="1420" height="275" rx="70" fill="#031d33" stroke="#dce9f3" stroke-width="10"/>
  </g>

  <text x="150" y="1325" font-family="Inter, Arial, sans-serif" font-size="188" font-weight="900" letter-spacing="-8">
    <tspan fill="#ffffff">Football</tspan>
    <tspan dx="18" fill="url(#greenGrad)">PA</tspan>
  </text>

  <text x="800" y="1395" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="600" fill="#ffffff" letter-spacing="1">
    Your digital football assistant
  </text>
</svg>
