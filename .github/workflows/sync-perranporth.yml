name: Sync Perranporth app
# Source app remains separate; this workflow publishes the public /Perranporth path. Host-safe sync.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-perranporth.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-perranporth
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Football PA website
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch Perranporth app
        run: |
          rm -rf _perranporth_source
          git clone --depth 1 https://github.com/PerranporthAFCMens/Perranporth.git _perranporth_source

      - name: Sync app into /Perranporth
        run: |
          rm -rf Perranporth
          mkdir -p Perranporth
          rsync -a \
            --exclude '.git' \
            --exclude 'apps-script' \
            --exclude 'supabase' \
            --exclude '*.md' \
            _perranporth_source/ Perranporth/

          SOURCE_SHA="$(git -C _perranporth_source rev-parse HEAD)"
          printf '%s\n' "$SOURCE_SHA" > Perranporth/.source-sha

          python - <<'PY'
          from pathlib import Path

          old = 'https://PerranporthAFCMens.github.io/Perranporth/'
          new = 'https://footballpa.com/Perranporth/'
          text_suffixes = {'.html', '.js', '.json', '.webmanifest', '.css', '.svg'}

          for path in Path('Perranporth').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit synced app
        id: commit
        run: |
          rm -rf _perranporth_source
          git add Perranporth
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Perranporth is already in sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Perranporth live app"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
