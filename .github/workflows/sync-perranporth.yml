name: Sync Perranporth app
# Lineup image share sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-perranporth.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-perranporth
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Football PA website
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch current Football PA Core
        run: |
          rm -rf _core_source
          git clone --depth 1 --branch main https://github.com/PerranporthAFCMens/Football-PA-Core-Web.git _core_source

      - name: Publish Perranporth customer app
        run: |
          rm -rf Perranporth
          mkdir -p Perranporth

          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.dev-preview' \
            --exclude '*.md' \
            --exclude 'scripts' \
            --exclude 'vercel.json' \
            --exclude 'dev.html' \
            --exclude 'dev-*.html' \
            --exclude 'admin-console.html' \
            _core_source/ Perranporth/

          CORE_SHA="$(git -C _core_source rev-parse HEAD)"
          printf '%s\n' "$CORE_SHA" > Perranporth/.core-source-sha

          mkdir -p Perranporth/classic-dashboard
          cat > Perranporth/classic-dashboard/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0;url=../classic-dashboard.html">
          <title>Opening Classic Dashboard…</title>
          <script>location.replace('../classic-dashboard.html'+location.search+location.hash)</script>
          </head><body><a href="../classic-dashboard.html">Open Classic Dashboard</a></body></html>
          EOF

      - name: Commit synced app
        id: commit
        run: |
          rm -rf _core_source
          git add Perranporth
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Perranporth is already in sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Perranporth from Football PA Core"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
